service: PedidoAPILambda

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  environment:
    DB_HOST: ${env:DB_HOST}
    DB_USER: ${env:DB_USER}
    DB_PASS: ${env:DB_PASS}
    DB_NAME: ${env:DB_NAME}
    DB_PORT: ${env:DB_PORT}

functions:
  api:
    handler: server.handler
    events:
      - http:
          path: pedidos
          method: get
      - http:
          path: pedidos
          method: post
      - http:
          path: pedidos/{id}
          method: get
      - http:
          path: pedidos/{id}
          method: patch
      - http:
          path: pedidos/{id}
          method: delete
